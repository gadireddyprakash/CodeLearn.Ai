name: Security Review — CodeLearn.Ai

on:
  push:
    branches: [main, develop, master]
    paths:
      - 'project/backend/**'
      - '.github/workflows/security-review.yml'
  pull_request:
    branches: [main, develop, master]
    paths:
      - 'project/backend/**'
  schedule:
    # Run full scan every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      fail_on_severity:
        description: 'Fail on severity level (critical, high, moderate, low)'
        required: false
        default: 'high'

# ─────────────────────────────────────────────────────────────
# Environment defaults
# ─────────────────────────────────────────────────────────────
env:
  NODE_VERSION: '20'
  BACKEND_DIR: ./project/backend
  REPORTS_DIR: ./security-reports
  FAIL_ON: ${{ github.event.inputs.fail_on_severity || 'high' }}

jobs:

  # ═══════════════════════════════════════════════════════════
  # JOB 1: Technology Stack Detection
  # ═══════════════════════════════════════════════════════════
  detect-stack:
    name: Detect Technology Stack
    runs-on: ubuntu-latest
    outputs:
      language: ${{ steps.detect.outputs.language }}
      framework: ${{ steps.detect.outputs.framework }}
      has_backend: ${{ steps.detect.outputs.has_backend }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Backend Stack
        id: detect
        run: |
          echo "=== Technology Stack Detection ==="

          BACKEND_PKG="${{ env.BACKEND_DIR }}/package.json"

          if [ -f "$BACKEND_PKG" ]; then
            echo "✅ Node.js/Express backend detected"
            echo "language=javascript" >> $GITHUB_OUTPUT
            echo "has_backend=true" >> $GITHUB_OUTPUT

            # Detect framework
            if grep -q '"express"' "$BACKEND_PKG"; then
              echo "framework=express" >> $GITHUB_OUTPUT
              echo "  → Framework: Express.js"
            elif grep -q '"fastify"' "$BACKEND_PKG"; then
              echo "framework=fastify" >> $GITHUB_OUTPUT
              echo "  → Framework: Fastify"
            else
              echo "framework=node" >> $GITHUB_OUTPUT
            fi

          elif [ -f "requirements.txt" ] || [ -f "setup.py" ]; then
            echo "✅ Python backend detected"
            echo "language=python" >> $GITHUB_OUTPUT
            echo "framework=python" >> $GITHUB_OUTPUT
            echo "has_backend=true" >> $GITHUB_OUTPUT
          elif [ -f "pom.xml" ] || [ -f "build.gradle" ]; then
            echo "✅ Java backend detected"
            echo "language=java" >> $GITHUB_OUTPUT
            echo "framework=java" >> $GITHUB_OUTPUT
            echo "has_backend=true" >> $GITHUB_OUTPUT
          elif [ -f "go.mod" ]; then
            echo "✅ Go backend detected"
            echo "language=go" >> $GITHUB_OUTPUT
            echo "framework=go" >> $GITHUB_OUTPUT
            echo "has_backend=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Backend not detected in standard locations"
            echo "has_backend=false" >> $GITHUB_OUTPUT
            echo "language=unknown" >> $GITHUB_OUTPUT
            echo "framework=unknown" >> $GITHUB_OUTPUT
          fi

  # ═══════════════════════════════════════════════════════════
  # JOB 2: Dependency Vulnerability Scan (npm audit)
  # ═══════════════════════════════════════════════════════════
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: detect-stack
    if: needs.detect-stack.outputs.has_backend == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create Reports Directory
        run: mkdir -p ${{ env.REPORTS_DIR }}

      - name: Install Backend Dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm ci --ignore-scripts

      - name: Run npm audit (JSON)
        working-directory: ${{ env.BACKEND_DIR }}
        continue-on-error: true
        run: |
          npm audit --json > ../../${{ env.REPORTS_DIR }}/npm-audit.json 2>&1 || true

      - name: Run npm audit (Human Readable)
        working-directory: ${{ env.BACKEND_DIR }}
        continue-on-error: true
        run: |
          npm audit > ../../${{ env.REPORTS_DIR }}/npm-audit.txt 2>&1 || true
          cat ../../${{ env.REPORTS_DIR }}/npm-audit.txt

      - name: Analyze npm audit results
        id: audit-check
        run: |
          if [ -f "${{ env.REPORTS_DIR }}/npm-audit.json" ]; then
            CRITICAL=$(node -e "try{const a=require('./${{ env.REPORTS_DIR }}/npm-audit.json');const m=a.metadata?.vulnerabilities||{};console.log(m.critical||0)}catch(e){console.log(0)}" 2>/dev/null || echo 0)
            HIGH=$(node -e "try{const a=require('./${{ env.REPORTS_DIR }}/npm-audit.json');const m=a.metadata?.vulnerabilities||{};console.log(m.high||0)}catch(e){console.log(0)}" 2>/dev/null || echo 0)
            MODERATE=$(node -e "try{const a=require('./${{ env.REPORTS_DIR }}/npm-audit.json');const m=a.metadata?.vulnerabilities||{};console.log(m.moderate||0)}catch(e){console.log(0)}" 2>/dev/null || echo 0)
            LOW=$(node -e "try{const a=require('./${{ env.REPORTS_DIR }}/npm-audit.json');const m=a.metadata?.vulnerabilities||{};console.log(m.low||0)}catch(e){console.log(0)}" 2>/dev/null || echo 0)

            echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
            echo "high=$HIGH" >> $GITHUB_OUTPUT
            echo "moderate=$MODERATE" >> $GITHUB_OUTPUT
            echo "low=$LOW" >> $GITHUB_OUTPUT

            echo "### npm audit Results" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Moderate | $MODERATE |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔵 Low | $LOW |" >> $GITHUB_STEP_SUMMARY

            FAIL_ON="${{ env.FAIL_ON }}"
            if [ "$FAIL_ON" = "critical" ] && [ "$CRITICAL" -gt 0 ]; then
              echo "❌ FAIL: $CRITICAL critical vulnerabilities found"
              exit 1
            elif [ "$FAIL_ON" = "high" ] && [ $(($CRITICAL + $HIGH)) -gt 0 ]; then
              echo "❌ FAIL: $((CRITICAL + HIGH)) critical/high vulnerabilities found"
              exit 1
            elif [ "$FAIL_ON" = "moderate" ] && [ $(($CRITICAL + $HIGH + $MODERATE)) -gt 0 ]; then
              echo "❌ FAIL: vulnerabilities found at moderate or above"
              exit 1
            fi
          fi

      - name: Generate SBOM
        working-directory: ${{ env.BACKEND_DIR }}
        continue-on-error: true
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --output-format json --output-file ../../${{ env.REPORTS_DIR }}/sbom.json 2>/dev/null || true
          echo "SBOM generated (if cyclonedx available)"

      - name: Upload Dependency Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan-reports
          path: ${{ env.REPORTS_DIR }}/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # JOB 3: Static Application Security Testing (SAST)
  # ═══════════════════════════════════════════════════════════
  sast-scan:
    name: SAST — Static Security Analysis
    runs-on: ubuntu-latest
    needs: detect-stack
    if: needs.detect-stack.outputs.has_backend == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create Reports Directory
        run: mkdir -p ${{ env.REPORTS_DIR }}

      - name: Run NodeJSScan (SAST)
        continue-on-error: true
        run: |
          pip install nodejsscan --quiet 2>/dev/null || true
          if command -v njsscan &> /dev/null; then
            njsscan --json -o ${{ env.REPORTS_DIR }}/njsscan.json ${{ env.BACKEND_DIR }} 2>/dev/null || true
            echo "✅ NodeJSScan completed"
          else
            echo "⚠️ NodeJSScan not available, skipping"
          fi

      - name: Run Semgrep SAST
        continue-on-error: true
        run: |
          pip install semgrep --quiet 2>/dev/null || true
          if command -v semgrep &> /dev/null; then
            semgrep scan \
              --config "p/nodejs" \
              --config "p/owasp-top-ten" \
              --config "p/jwt" \
              --config "p/secrets" \
              --json \
              --output ${{ env.REPORTS_DIR }}/semgrep.json \
              ${{ env.BACKEND_DIR }} 2>/dev/null || true
            echo "✅ Semgrep scan completed"
          else
            echo "⚠️ Semgrep not available, skipping"
          fi

      - name: Run Custom Security Checks
        run: |
          echo "=== CodeLearn.Ai Custom SAST Rules ===" | tee ${{ env.REPORTS_DIR }}/custom-sast.txt

          FINDINGS=0

          # CRITICAL: Check for seed-admin route
          if grep -r "seed-admin" "${{ env.BACKEND_DIR }}" --include="*.js" -l 2>/dev/null; then
            echo "🔴 CRITICAL [F001]: /api/auth/seed-admin route detected" | tee -a ${{ env.REPORTS_DIR }}/custom-sast.txt
            FINDINGS=$((FINDINGS + 1))
          fi

          # CRITICAL: Check for bypassed OTP
          if grep -r "Bypassed" "${{ env.BACKEND_DIR }}" --include="*.js" 2>/dev/null; then
            echo "🔴 CRITICAL [F002]: OTP verification bypass detected (commented-out code)" | tee -a ${{ env.REPORTS_DIR }}/custom-sast.txt
            FINDINGS=$((FINDINGS + 1))
          fi

          # CRITICAL: Check for hardcoded credentials
          if grep -rE "(admin123|codelearn-setup-2024|admin@codelearn)" "${{ env.BACKEND_DIR }}" --include="*.js" 2>/dev/null; then
            echo "🔴 CRITICAL [F003]: Hardcoded admin credentials detected" | tee -a ${{ env.REPORTS_DIR }}/custom-sast.txt
            FINDINGS=$((FINDINGS + 1))
          fi

          # HIGH: Check for execSync with user input
          if grep -r "execSync" "${{ env.BACKEND_DIR }}" --include="*.js" 2>/dev/null; then
            echo "🟠 HIGH [F010]: execSync usage detected — potential command injection" | tee -a ${{ env.REPORTS_DIR }}/custom-sast.txt
            FINDINGS=$((FINDINGS + 1))
          fi

          # HIGH: Check for vm.runInNewContext
          if grep -r "runInNewContext\|runInContext\|runInThisContext" "${{ env.BACKEND_DIR }}" --include="*.js" 2>/dev/null; then
            echo "🟠 HIGH [F010]: vm.runInNewContext detected — not a security sandbox" | tee -a ${{ env.REPORTS_DIR }}/custom-sast.txt
            FINDINGS=$((FINDINGS + 1))
          fi

          # HIGH: Check for missing helmet
          if ! grep -r "helmet" "${{ env.BACKEND_DIR }}/server.js" 2>/dev/null; then
            echo "🟠 HIGH [F005]: helmet security headers NOT configured" | tee -a ${{ env.REPORTS_DIR }}/custom-sast.txt
            FINDINGS=$((FINDINGS + 1))
          fi

          # HIGH: Check for missing mongo-sanitize
          if ! grep -r "mongoSanitize\|mongo-sanitize" "${{ env.BACKEND_DIR }}/server.js" 2>/dev/null; then
            echo "🟠 HIGH [F006]: express-mongo-sanitize NOT configured — NoSQL injection risk" | tee -a ${{ env.REPORTS_DIR }}/custom-sast.txt
            FINDINGS=$((FINDINGS + 1))
          fi

          # HIGH: Check for direct regex from user input
          if grep -r "\$regex.*req\." "${{ env.BACKEND_DIR }}" --include="*.js" 2>/dev/null; then
            echo "🟠 HIGH [F013]: Unescaped user input in \$regex — ReDoS risk" | tee -a ${{ env.REPORTS_DIR }}/custom-sast.txt
            FINDINGS=$((FINDINGS + 1))
          fi

          # HIGH: Check for spread of req.body into DB operations
          if grep -r "\.create({.*\.\.\.req\.body\|findByIdAndUpdate.*req\.body[^,]" "${{ env.BACKEND_DIR }}" --include="*.js" 2>/dev/null; then
            echo "🟠 HIGH [F014]: req.body spread into DB operation — mass assignment risk" | tee -a ${{ env.REPORTS_DIR }}/custom-sast.txt
            FINDINGS=$((FINDINGS + 1))
          fi

          # MEDIUM: Check for OTP in console.log
          if grep -r "console.log.*otp\|console.log.*OTP" "${{ env.BACKEND_DIR }}" -i --include="*.js" 2>/dev/null; then
            echo "🟡 MEDIUM [F017]: OTP logged to console — plaintext sensitive data in logs" | tee -a ${{ env.REPORTS_DIR }}/custom-sast.txt
            FINDINGS=$((FINDINGS + 1))
          fi

          # MEDIUM: Check for error.message returned to client
          if grep -r "error\.message" "${{ env.BACKEND_DIR }}" --include="*.js" 2>/dev/null | grep -v "console\|throw\|new Error" | head -5; then
            echo "🟡 MEDIUM [F018]: error.message returned to HTTP client — internal data exposure" | tee -a ${{ env.REPORTS_DIR }}/custom-sast.txt
            FINDINGS=$((FINDINGS + 1))
          fi

          # MEDIUM: Check for large body limit
          if grep -r "limit.*10mb\|limit.*'10mb'" "${{ env.BACKEND_DIR }}" --include="*.js" -i 2>/dev/null; then
            echo "🟡 MEDIUM [F022]: 10MB JSON body limit — DoS risk" | tee -a ${{ env.REPORTS_DIR }}/custom-sast.txt
            FINDINGS=$((FINDINGS + 1))
          fi

          # MEDIUM: Check JWT verify without algorithm
          if grep -r "jwt\.verify" "${{ env.BACKEND_DIR }}" --include="*.js" 2>/dev/null | grep -v "algorithms"; then
            echo "🔵 LOW [F028]: jwt.verify without algorithm specification" | tee -a ${{ env.REPORTS_DIR }}/custom-sast.txt
            FINDINGS=$((FINDINGS + 1))
          fi

          # Check for CORS NODE_ENV bypass
          if grep -r "NODE_ENV.*!==.*production\|NODE_ENV.*!=.*production" "${{ env.BACKEND_DIR }}" --include="*.js" 2>/dev/null | grep -i cors; then
            echo "🔴 CRITICAL [F004]: CORS NODE_ENV bypass detected" | tee -a ${{ env.REPORTS_DIR }}/custom-sast.txt
            FINDINGS=$((FINDINGS + 1))
          fi

          echo "" | tee -a ${{ env.REPORTS_DIR }}/custom-sast.txt
          echo "Total custom findings: $FINDINGS" | tee -a ${{ env.REPORTS_DIR }}/custom-sast.txt

          # Add to workflow summary
          echo "### Custom SAST Results" >> $GITHUB_STEP_SUMMARY
          echo "**$FINDINGS custom security findings**" >> $GITHUB_STEP_SUMMARY
          cat ${{ env.REPORTS_DIR }}/custom-sast.txt >> $GITHUB_STEP_SUMMARY

          # Fail if critical custom findings found
          CRITICAL_CUSTOM=$(grep -c "CRITICAL" ${{ env.REPORTS_DIR }}/custom-sast.txt || true)
          HIGH_CUSTOM=$(grep -c "HIGH" ${{ env.REPORTS_DIR }}/custom-sast.txt || true)
          FAIL_ON="${{ env.FAIL_ON }}"

          if [ "$FAIL_ON" = "critical" ] && [ "$CRITICAL_CUSTOM" -gt 0 ]; then
            echo "❌ FAIL: $CRITICAL_CUSTOM critical SAST findings"
            exit 1
          elif [ "$FAIL_ON" = "high" ] && [ $(($CRITICAL_CUSTOM + $HIGH_CUSTOM)) -gt 0 ]; then
            echo "❌ FAIL: Critical or High SAST findings detected"
            exit 1
          fi

      - name: Scan for Secrets
        continue-on-error: true
        run: |
          # Check for common secret patterns
          echo "=== Secret Detection ===" | tee ${{ env.REPORTS_DIR }}/secrets-scan.txt

          patterns=(
            "ANTHROPIC_API_KEY.*=.*sk-ant"
            "OPENAI_API_KEY.*=.*sk-"
            "GEMINI_API_KEY.*=.*AIza"
            "mongodb\+srv://.*:.*@"
            "password.*=.*['\"].*['\"]"
            "secret.*=.*['\"].*['\"]"
          )

          for pattern in "${patterns[@]}"; do
            if grep -rE "$pattern" "${{ env.BACKEND_DIR }}" --include="*.js" \
               --exclude-dir="node_modules" 2>/dev/null | grep -v ".env.example"; then
              echo "⚠️ Potential secret pattern found: $pattern" | tee -a ${{ env.REPORTS_DIR }}/secrets-scan.txt
            fi
          done

      - name: Upload SAST Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: ${{ env.REPORTS_DIR }}/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # JOB 4: Endpoint Security Verification
  # ═══════════════════════════════════════════════════════════
  endpoint-audit:
    name: API Endpoint Security Audit
    runs-on: ubuntu-latest
    needs: detect-stack
    if: needs.detect-stack.outputs.has_backend == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Reports Directory
        run: mkdir -p ${{ env.REPORTS_DIR }}

      - name: Audit Unauthenticated Endpoints
        run: |
          echo "=== Unauthenticated Endpoint Audit ===" | tee ${{ env.REPORTS_DIR }}/endpoint-audit.txt
          echo "" >> ${{ env.REPORTS_DIR }}/endpoint-audit.txt

          BACKEND="${{ env.BACKEND_DIR }}"
          ISSUES=0

          # Check for unprotected routes in each route file
          for route_file in $BACKEND/routes/*.js; do
            filename=$(basename "$route_file")
            echo "--- Checking $filename ---" >> ${{ env.REPORTS_DIR }}/endpoint-audit.txt

            # Find routes without protect middleware
            grep -n "router\.\(get\|post\|put\|delete\|patch\)" "$route_file" 2>/dev/null | \
              grep -v "protect\|authorize\|optionalAuth" | \
              while IFS= read -r line; do
                echo "⚠️ UNPROTECTED: $filename → $line" | tee -a ${{ env.REPORTS_DIR }}/endpoint-audit.txt
              done
          done

          # Specific high-risk checks
          echo "" >> ${{ env.REPORTS_DIR }}/endpoint-audit.txt
          echo "=== High-Risk Endpoint Checks ===" >> ${{ env.REPORTS_DIR }}/endpoint-audit.txt

          if grep -r "seed-admin\|seedAdmin\|seed_admin" "$BACKEND/routes" --include="*.js" 2>/dev/null; then
            echo "🔴 CRITICAL: Admin seed endpoint exists" | tee -a ${{ env.REPORTS_DIR }}/endpoint-audit.txt
            ISSUES=$((ISSUES + 1))
          fi

          if grep -r "leaderboard" "$BACKEND/routes" --include="*.js" 2>/dev/null | grep -v "protect"; then
            echo "🟠 HIGH: Leaderboard endpoint has no auth requirement" | tee -a ${{ env.REPORTS_DIR }}/endpoint-audit.txt
          fi

          echo "Endpoint audit complete. High-risk issues: $ISSUES" >> ${{ env.REPORTS_DIR }}/endpoint-audit.txt

      - name: Upload Endpoint Audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endpoint-audit-report
          path: ${{ env.REPORTS_DIR }}/endpoint-audit.txt
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # JOB 5: CodeQL Analysis (GitHub Native)
  # ═══════════════════════════════════════════════════════════
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: detect-stack
    if: needs.detect-stack.outputs.has_backend == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  # ═══════════════════════════════════════════════════════════
  # JOB 6: Security Report Aggregation
  # ═══════════════════════════════════════════════════════════
  security-report:
    name: Aggregate Security Report
    runs-on: ubuntu-latest
    needs: [dependency-scan, sast-scan, endpoint-audit]
    if: always()

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports/
        continue-on-error: true

      - name: Generate HTML Security Report
        run: |
          mkdir -p final-report

          cat > final-report/security-report.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>CodeLearn.Ai — Security Review Report</title>
            <style>
              body { font-family: 'Segoe UI', Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #0d1117; color: #c9d1d9; }
              h1 { color: #58a6ff; }
              h2 { color: #f0883e; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
              .badge { display: inline-block; padding: 4px 12px; border-radius: 4px; font-weight: bold; font-size: 0.9em; }
              .critical { background: #8b1a1a; color: white; }
              .high { background: #cc4e00; color: white; }
              .medium { background: #9a6400; color: white; }
              .low { background: #1a6b2a; color: white; }
              .score { font-size: 3em; font-weight: bold; color: #f85149; }
              table { width: 100%; border-collapse: collapse; margin: 20px 0; }
              th { background: #161b22; color: #58a6ff; padding: 10px; text-align: left; }
              td { padding: 8px 10px; border-bottom: 1px solid #21262d; vertical-align: top; }
              tr:hover td { background: #161b22; }
              .summary-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin: 20px 0; }
            </style>
          </head>
          <body>
            <h1>CodeLearn.Ai — Security Assessment Report</h1>
            <p>Generated: $(date -u '+%Y-%m-%d %H:%M UTC') | Branch: ${{ github.ref_name }} | Run: #${{ github.run_number }}</p>

            <div class="summary-box">
              <h2>Security Score</h2>
              <div class="score">12 / 100</div>
              <p><strong>Status: CRITICAL RISK — Not Suitable for Production</strong></p>
            </div>

            <h2>Finding Summary</h2>
            <table>
              <tr><th>Severity</th><th>Count</th></tr>
              <tr><td><span class="badge critical">CRITICAL</span></td><td>4</td></tr>
              <tr><td><span class="badge high">HIGH</span></td><td>10</td></tr>
              <tr><td><span class="badge medium">MEDIUM</span></td><td>10</td></tr>
              <tr><td><span class="badge low">LOW</span></td><td>4</td></tr>
              <tr><td><strong>TOTAL</strong></td><td><strong>28</strong></td></tr>
            </table>

            <h2>Top 3 Critical Risks</h2>
            <ol>
              <li><span class="badge critical">CRITICAL</span> Admin Seed Endpoint — Instant Admin Takeover (CVSS 9.8)</li>
              <li><span class="badge critical">CRITICAL</span> Remote Code Execution via Local Fallback (execSync)</li>
              <li><span class="badge critical">CRITICAL</span> OTP Verification Completely Bypassed</li>
            </ol>

            <h2>OWASP Top 10 Status</h2>
            <table>
              <tr><th>Category</th><th>Status</th><th>Findings</th></tr>
              <tr><td>A01: Broken Access Control</td><td>❌ FAIL</td><td>7 findings</td></tr>
              <tr><td>A02: Cryptographic Failures</td><td>❌ FAIL</td><td>5 findings</td></tr>
              <tr><td>A03: Injection</td><td>❌ FAIL</td><td>3 findings</td></tr>
              <tr><td>A04: Insecure Design</td><td>❌ FAIL</td><td>4 findings</td></tr>
              <tr><td>A05: Security Misconfiguration</td><td>❌ FAIL</td><td>3 findings</td></tr>
              <tr><td>A06: Vulnerable Components</td><td>❌ FAIL</td><td>9 CVEs</td></tr>
              <tr><td>A07: Auth Failures</td><td>❌ FAIL</td><td>6 findings</td></tr>
              <tr><td>A08: Software Integrity</td><td>⚠️ PARTIAL</td><td>2 findings</td></tr>
              <tr><td>A09: Logging & Monitoring</td><td>❌ FAIL</td><td>4 findings</td></tr>
              <tr><td>A10: SSRF</td><td>⚠️ AT RISK</td><td>RCE + axios CVE</td></tr>
            </table>

            <p><em>Full report: <a href="security-review.md" style="color:#58a6ff">security-review.md</a></em></p>
          </body>
          </html>
          HTML

          echo "✅ HTML report generated"

      - name: Generate Summary Markdown
        run: |
          echo "# 🔐 CodeLearn.Ai Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\` | **Run:** #${{ github.run_number }} | **Date:** $(date -u '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Overall Security Score: 12 / 100 — CRITICAL RISK ⛔" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 CRITICAL | 4 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 HIGH | 10 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 MEDIUM | 10 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 LOW | 4 |" >> $GITHUB_STEP_SUMMARY
          echo "| **TOTAL** | **28** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Top Priority Actions" >> $GITHUB_STEP_SUMMARY
          echo "1. 🚨 Remove \`/api/auth/seed-admin\` route immediately" >> $GITHUB_STEP_SUMMARY
          echo "2. 🚨 Re-enable OTP verification in authController.js" >> $GITHUB_STEP_SUMMARY
          echo "3. 🚨 Remove local code execution fallback (execSync)" >> $GITHUB_STEP_SUMMARY
          echo "4. 🚨 Fix CORS to explicit whitelist only" >> $GITHUB_STEP_SUMMARY
          echo "5. 🚨 Run \`npm audit fix\` to patch 9 CVEs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full report: \`project/Vulnerability Test Results/security-review.md\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-final-report-${{ github.run_number }}
          path: final-report/
          retention-days: 90

  # ═══════════════════════════════════════════════════════════
  # JOB 7: Security Gate — Block PR on Critical Findings
  # ═══════════════════════════════════════════════════════════
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [dependency-scan, sast-scan, endpoint-audit]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Evaluate Security Gate
        run: |
          echo "=== Security Gate Evaluation ==="
          echo "Fail threshold: ${{ env.FAIL_ON }}"

          GATE_PASSED=true

          # Check for critical patterns that must never be merged
          if grep -r "seed-admin" "./project/backend/routes" --include="*.js" 2>/dev/null; then
            echo "❌ GATE FAIL: Admin seed route detected in PR"
            GATE_PASSED=false
          fi

          if grep -r "Bypassed" "./project/backend/controllers/authController.js" 2>/dev/null; then
            echo "❌ GATE FAIL: OTP bypass detected in PR"
            GATE_PASSED=false
          fi

          if grep -r "execSync\|runInNewContext" "./project/backend/utils/judge0.js" 2>/dev/null | grep -v "^#\|^//"; then
            echo "⚠️ WARNING: Local code execution still present"
          fi

          if [ "$GATE_PASSED" = "false" ]; then
            echo ""
            echo "╔══════════════════════════════════════════════════╗"
            echo "║     ⛔ SECURITY GATE BLOCKED THIS PULL REQUEST   ║"
            echo "║                                                  ║"
            echo "║  Critical security issues must be resolved       ║"
            echo "║  before this PR can be merged.                   ║"
            echo "║                                                  ║"
            echo "║  See security-review.md for remediation steps.  ║"
            echo "╚══════════════════════════════════════════════════╝"
            exit 1
          else
            echo "✅ Security gate passed for PR"
          fi
